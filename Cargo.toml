[package]
name = "void_armada"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = { version = "0.20.1", features = ["wav"] }
dirs = "7.0.0"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
# drop debug info from shipped binaries (function names stay for backtraces)
strip = "debuginfo"

# dock icon for dev runs (an app bundle uses its .icns); same versions winit already pulls in
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }

# window and taskbar icon on Windows and Linux (macOS uses the dock icon above)
[target.'cfg(not(target_os = "macos"))'.dependencies]
winit = { version = "=0.30.13", default-features = false }

[build-dependencies]
winresource = "0.1.34"
